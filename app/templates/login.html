<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Test Agent - Sign In</title>

    <link
        rel="stylesheet"
        href="/static/css/login.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                AI TEST AGENT
            </div>

            <p class="subtitle">
                Enterprise AI Test Case Generator
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="signInButton"
                >
                    Sign In
                </button>

                <div
                    id="errorMessage"
                    class="error-message"
                ></div>

            </form>

        </div>

    </div>

    <script src="/static/js/login.js"></script>

</body>

</html>
